name: hourly-job-update

on:
  schedule:
    - cron: "7 * * * *"    # every hour at :07 (GitHub may start it a few minutes late)
  workflow_dispatch:       # "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: job-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Update jobs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python update_jobs.py
      - name: Publish
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || (git commit -m "Update jobs" && git pull --rebase && git push)
